[project]
name = "mojo-intervaltree"
version = "0.1.0"
description = "Mojo-accelerated interval tree queries with an intervaltree-compatible API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "intervaltree"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-intervaltree"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
